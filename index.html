<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbf8f1">
<title>채채 답장함</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23fee500'/><text x='32' y='43' font-size='30' text-anchor='middle'>💬</text></svg>">
<style>
:root{
  --bg:#fbf8f1;--card:#ffffff;--line:#ece6d9;--text:#2b2620;--sub:#8a8174;
  --them:#f2efe8;--me:#fee17a;--meSoft:#fff3c4;--accent:#3a2f1f;--ok:#2f8a4f;--warn:#c0602a;--bad:#b4373a;
  --chip:#f4efe4;--chipOn:#2b2620;--chipOnText:#fff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171512;--card:#211e1a;--line:#36312a;--text:#efe9df;--sub:#a59c8e;
    --them:#2c2823;--me:#d9b440;--meSoft:#4a3f1f;--accent:#f3e6c5;--chip:#2c2823;--chipOn:#efe9df;--chipOnText:#171512;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0}
.live{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.on{background:var(--ok)} .dot.err{background:var(--bad)}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:var(--chip);color:var(--text);padding:8px 12px;border-radius:999px;font-size:14px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--chipOn);color:var(--chipOnText)}
.tab b{margin-left:4px;font-weight:600;opacity:.8}
main{max-width:640px;margin:0 auto;padding:12px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.head{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;background:var(--chip);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--sub)}
.name{font-weight:700;font-size:17px}
.time{font-size:13px;color:var(--sub);margin-top:2px}
.reason{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--meSoft);font-weight:700;font-size:14px}
.summary{margin:12px 0 4px;color:var(--sub);font-size:15px;line-height:1.5}
.msgs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.b{max-width:80%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.b small{display:block;font-size:11px;color:var(--sub);margin-top:4px}
.them{align-self:flex-start;background:var(--them);border-top-left-radius:6px}
.me{align-self:flex-end;background:var(--meSoft);border-top-right-radius:6px}
.lbl{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.draft{align-self:flex-end;background:var(--me);color:#2b2620;border-top-right-radius:6px}
.edit textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:15px;background:var(--bg);color:var(--text);margin-bottom:6px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:11px 0;font-size:15px;cursor:pointer}
.btn.pri{background:var(--me);border-color:var(--me);color:#2b2620;font-weight:700}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:var(--warn);margin-top:8px}
.st{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--chip)}
.st.sent{color:var(--ok)} .st.fail{color:var(--bad)} .st.wait{color:var(--warn)}
details{margin-top:10px} summary{cursor:pointer;color:var(--sub);font-size:14px}
.empty{text-align:center;color:var(--sub);padding:60px 0}
.setup{max-width:480px;margin:40px auto;padding:0 16px}
.setup input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:15px;background:var(--card);color:var(--text)}
.setup .btn{width:100%;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.bar{display:flex;justify-content:flex-end;margin-top:6px}
.link{background:none;border:0;color:var(--sub);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(() => {
const DEFAULT_REPO = 'dreamch7777-code/chaechae-inbox-data';
const POLL_MS = 3000;
const $ = s => document.querySelector(s);
const ls = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }, del(k){ try{localStorage.removeItem(k)}catch(e){} } };
let token = ls.get('cci_token') || '';
let repo = ls.get('cci_repo') || DEFAULT_REPO;
let state = { chats: [], sha: null, etag: null, sent: {}, sentEtag: null, avatars: {}, tab: ls.get('cci_tab') || 'reply', editing: {}, live: 'off', lastOk: 0 };

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')), c => c.charCodeAt(0)));
const b64enc = s => { const bytes = new TextEncoder().encode(s); let bin=''; for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); };
const hasBlank = arr => (arr||[]).some(t => /\[[^\]]*\]/.test(t));
const rid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2200); }
const api = (path, opt={}) => fetch(`https://api.github.com/repos/${repo}/contents/${path}`, { cache:'no-store', ...opt, headers:{ 'Authorization':`Bearer ${token}`, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(opt.headers||{}) } });

// ---------- load ----------
async function loadChats(force){
  const h = {}; if (state.etag && !force) h['If-None-Match'] = state.etag;
  const r = await api('chats.json', { headers: h });
  if (r.status === 304) return false;
  if (r.status === 401 || r.status === 403) throw new Error('auth');
  if (r.status === 404) throw new Error('nofile');
  if (!r.ok) throw new Error('http'+r.status);
  const j = await r.json();
  state.etag = r.headers.get('ETag'); state.sha = j.sha;
  const data = JSON.parse(b64dec(j.content));
  state.chats = data.chats || [];
  return true;
}
async function loadSent(){
  const h = {}; if (state.sentEtag) h['If-None-Match'] = state.sentEtag;
  const r = await api('sent.json', { headers: { ...h, 'Accept':'application/vnd.github.raw+json' } });
  if (r.status === 304 || r.status === 404) return false;
  if (!r.ok) return false;
  state.sentEtag = r.headers.get('ETag');
  try { state.sent = JSON.parse(await r.text()) || {}; } catch(e) { state.sent = {}; }
  return true;
}
async function loadAvatars(){
  try { const r = await api('avatars.json', { headers:{ 'Accept':'application/vnd.github.raw+json' } }); if (r.ok) state.avatars = JSON.parse(await r.text()) || {}; } catch(e){}
}

// ---------- write (operation-based with retry) ----------
let writing = Promise.resolve();
function mutate(id, fn, msg){
  // optimistic local update
  const c = state.chats.find(x => x.id === id); if (c) fn(c); render();
  writing = writing.then(() => commit(id, fn, msg)).catch(e => { toast('저장 실패: 다시 눌러주세요'); console.error(e); loadChats(true).then(render); });
  return writing;
}
async function commit(id, fn, msg){
  for (let i=0;i<5;i++){
    await loadChats(true);
    const c = state.chats.find(x => x.id === id); if (!c) return;
    fn(c); c.updatedAt = new Date().toISOString();
    const body = JSON.stringify({ updatedAt: new Date().toISOString(), chats: state.chats }, null, 1);
    const r = await api('chats.json', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: msg, content: b64enc(body), sha: state.sha }) });
    if (r.ok){ const j = await r.json(); state.sha = j.content.sha; state.etag = null; render(); return; }
    if (r.status !== 409 && r.status !== 422) throw new Error('put '+r.status);
    await new Promise(res => setTimeout(res, 300 + i*300));
  }
  throw new Error('conflict');
}

// ---------- status ----------
function sendState(c){
  if (!c.approval) return null;
  const s = state.sent[c.approval.id];
  if (s) return s.state; // sending | sent | failed
  return 'queued';
}
function bucket(c){
  if (c.status === 'deleted') return null;
  const s = sendState(c);
  if (c.status === 'approved') return (s === 'sent') ? 'sent' : 'reply';
  if (c.status === 'skipped' || c.status === 'sent') return 'sent';
  if (c.category === 'inquiry') return 'inquiry';
  if (c.category === 'plus' || /톡클라우드 복원 필요/.test(c.summary||'') || c.checkReason) return 'check';
  return 'reply';
}

// ---------- render ----------
const TABS = [['reply','답장할 것'],['check','확인 필요'],['inquiry','예약·문의'],['sent','보낸 것']];
function render(){
  if (!token) return renderSetup();
  const groups = { reply:[], check:[], inquiry:[], sent:[] };
  for (const c of state.chats){ const b = bucket(c); if (b) groups[b].push(c); }
  const byTime = (a,b) => String(b.sortKey||b.updatedAt||'').localeCompare(String(a.sortKey||a.updatedAt||''));
  Object.values(groups).forEach(g => g.sort(byTime));
  const list = groups[state.tab] || [];
  $('#app').innerHTML = `
  <header><div class="top"><h1>채채 답장함</h1><div class="live"><span class="dot ${state.live==='on'?'on':state.live==='err'?'err':''}"></span>${state.live==='on'?'실시간':state.live==='err'?'연결 확인 중':'연결 중'}</div></div>
  <div class="tabs">${TABS.map(([k,l]) => `<button class="tab ${state.tab===k?'on':''}" data-tab="${k}">${l}<b>${groups[k].length}</b></button>`).join('')}</div></header>
  <main>${list.length ? list.map(card).join('') : `<div class="empty">비어 있어요 ✨</div>`}
  ${state.tab==='sent' && list.length ? `<div class="bar"><button class="link" data-act="purge">보낸 것 모두 지우기</button></div>`:''}
  <div class="bar"><button class="link" data-act="logout">토큰 다시 넣기</button></div></main>`;
}
function avatar(c){
  const src = state.avatars[c.id] || state.avatars[c.name] || c.avatar;
  return src ? `<img class="av" src="${esc(src)}" alt="">` : `<div class="av">${esc((c.name||'?').trim()[0]||'?')}</div>`;
}
function card(c){
  const s = sendState(c);
  const editing = state.editing[c.id];
  const draft = (c.status==='approved' && c.approval) ? c.approval.messages : (c.draftMessages||[]);
  const blank = hasBlank(draft);
  const msgs = (c.messages||[]).slice(-8).map(m => `<div class="b ${m.sender==='me'?'me':'them'}">${esc(m.text)}${m.time?`<small>${esc(m.time)}</small>`:''}</div>`).join('');
  const reason = c.checkReason || (c.category==='plus' ? (c.summary||'').replace(/^확인 필요:\s*/,'') : '') || (/톡클라우드 복원 필요/.test(c.summary||'') ? '🔄 톡클라우드 복원 필요 — 최신 대화가 더 있을 수 있어요' : '');
  let status = '';
  if (c.status==='approved'){
    status = s==='sent' ? `<span class="st sent">✓ 보냄 ${esc(fmt(state.sent[c.approval.id].at))}</span>`
      : s==='sending' ? `<span class="st wait">📤 보내는 중…</span>`
      : s==='failed' ? `<span class="st fail">⚠️ 못 보냄: ${esc(state.sent[c.approval.id].reason||'')}</span>`
      : `<span class="st wait">⏳ 발송 대기 (PC가 곧 보내요)</span>`;
  } else if (c.status==='skipped') status = `<span class="st">건너뜀${c.skipMemo?': '+esc(c.skipMemo):''}</span>`;
  const draftHtml = editing
    ? `<div class="edit">${(editing).map((t,i)=>`<textarea data-ed="${esc(c.id)}" data-i="${i}">${esc(t)}</textarea>`).join('')}<button class="link" data-act="addline" data-id="${esc(c.id)}">+ 말풍선 추가</button></div>`
    : draft.length ? `<div class="msgs">${draft.map(t=>`<div class="b draft">${esc(t)}</div>`).join('')}</div>` : '';
  let btns = '';
  if (editing) btns = `<div class="btns" style="grid-template-columns:1fr 1fr"><button class="btn pri" data-act="saveedit" data-id="${esc(c.id)}">저장</button><button class="btn" data-act="canceledit" data-id="${esc(c.id)}">취소</button></div>`;
  else if (c.status==='approved' && s!=='sent' && s!=='sending') btns = `<div class="btns" style="grid-template-columns:1fr 1fr"><button class="btn" data-act="unapprove" data-id="${esc(c.id)}">승인 취소</button><button class="btn del" data-act="delete" data-id="${esc(c.id)}">삭제</button></div>`;
  else if (bucket(c)==='sent') btns = `<div class="btns" style="grid-template-columns:1fr"><button class="btn del" data-act="delete" data-id="${esc(c.id)}">삭제</button></div>`;
  else if (draft.length) btns = `<div class="btns"><button class="btn pri" data-act="approve" data-id="${esc(c.id)}" ${blank?'disabled':''}>승인</button><button class="btn" data-act="edit" data-id="${esc(c.id)}">고치기</button><button class="btn" data-act="skip" data-id="${esc(c.id)}">건너뛰기</button><button class="btn del" data-act="delete" data-id="${esc(c.id)}">삭제</button></div>${blank?'<div class="hint">[ ] 빈칸을 고치기에서 채워야 승인할 수 있어요</div>':''}`;
  else btns = `<div class="btns" style="grid-template-columns:1fr 1fr 1fr"><button class="btn" data-act="edit" data-id="${esc(c.id)}">답장 쓰기</button><button class="btn" data-act="skip" data-id="${esc(c.id)}">확인함</button><button class="btn del" data-act="delete" data-id="${esc(c.id)}">삭제</button></div>`;
  return `<div class="card">
    <div class="head">${avatar(c)}<div><div class="name">${esc(c.name)}</div><div class="time">${esc(c.displayTime||'')}</div></div></div>
    ${reason?`<div class="reason">${esc(reason)}</div>`:''}
    ${c.summary && !reason?`<div class="summary">${esc(c.summary)}</div>`:''}
    ${msgs?`<div class="lbl">최근 대화</div><div class="msgs">${msgs}</div>`:''}
    ${(draftHtml)?`<div class="lbl">${c.status==='approved'?'승인한 답장':'보낼 답장'}</div>${draftHtml}`:''}
    ${status}${btns}</div>`;
}
function fmt(iso){ if(!iso) return ''; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
function renderSetup(){
  $('#app').innerHTML = `<div class="setup"><h1>채채 답장함</h1>
  <p style="color:var(--sub);line-height:1.6">처음 한 번만 GitHub 토큰을 넣어주세요. 이 기기에만 저장돼요.</p>
  <input id="tk" type="password" placeholder="github_pat_로 시작하는 토큰" autocomplete="off">
  <button class="btn pri" id="save">시작하기</button></div>`;
  $('#save').onclick = () => { const v = $('#tk').value.trim(); if(!v) return; token=v; ls.set('cci_token', v); start(); };
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab){ state.tab = t.dataset.tab; ls.set('cci_tab', state.tab); render(); window.scrollTo(0,0); return; }
  const id = t.dataset.id, act = t.dataset.act, c = state.chats.find(x => x.id === id);
  if (act==='logout'){ ls.del('cci_token'); token=''; render(); return; }
  if (act==='purge'){
    const ids = state.chats.filter(x => bucket(x)==='sent').map(x=>x.id); if(!ids.length) return;
    ids.forEach(i => { const cc = state.chats.find(x=>x.id===i); if (cc) cc.status='deleted'; }); render();
    writing = writing.then(async () => { for (let k=0;k<5;k++){ await loadChats(true); state.chats.forEach(x => { if (ids.includes(x.id)) x.status='deleted'; }); const body = JSON.stringify({updatedAt:new Date().toISOString(),chats:state.chats},null,1); const r = await api('chats.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'보낸 것 정리',content:b64enc(body),sha:state.sha})}); if(r.ok){state.etag=null;render();return;} await new Promise(r=>setTimeout(r,400)); } });
    toast('보낸 것을 지웠어요'); return;
  }
  if (!c) return;
  if (act==='approve'){
    const msgs = (c.draftMessages||[]).map(s=>s.trim()).filter(Boolean);
    if (!msgs.length || hasBlank(msgs)) return;
    mutate(id, x => { x.status='approved'; x.approval={ id: rid(), messages: msgs, at: new Date().toISOString() }; }, `승인: ${c.name}`);
    toast('승인했어요 — PC가 바로 보내요 📤');
  } else if (act==='unapprove'){
    mutate(id, x => { x.status='draft'; x.approval=null; }, `승인 취소: ${c.name}`); toast('승인 취소했어요');
  } else if (act==='skip'){
    mutate(id, x => { x.status='skipped'; }, `건너뛰기: ${c.name}`); toast('건너뛰었어요');
  } else if (act==='delete'){
    mutate(id, x => { x.status='deleted'; }, `삭제: ${c.name}`); toast('삭제했어요');
  } else if (act==='edit'){
    state.editing[id] = [...((c.draftMessages&&c.draftMessages.length)?c.draftMessages:[''])]; render();
  } else if (act==='addline'){
    state.editing[id].push(''); render();
  } else if (act==='canceledit'){
    delete state.editing[id]; render();
  } else if (act==='saveedit'){
    const lines = [...document.querySelectorAll(`textarea[data-ed="${CSS.escape(id)}"]`)].map(x=>x.value.trim()).filter(Boolean);
    delete state.editing[id];
    mutate(id, x => { x.draftMessages = lines; if (x.status!=='approved') x.status='draft'; }, `고치기: ${c.name}`); toast('저장했어요');
  }
});
document.addEventListener('input', e => { const t=e.target; if (t.dataset && t.dataset.ed){ const arr = state.editing[t.dataset.ed]; if (arr) arr[+t.dataset.i] = t.value; } });

// ---------- loop ----------
let timer = null;
async function tick(){
  try {
    const a = await loadChats(false); const b = await loadSent();
    state.live='on'; state.lastOk=Date.now();
    if ((a||b) && !Object.keys(state.editing).length) render(); else if (a||b) {/* keep editing UI */}
    else if (state._wasErr) render();
    state._wasErr = false;
  } catch(e){
    if (e.message==='auth'){ toast('토큰이 맞지 않아요'); ls.del('cci_token'); token=''; render(); return; }
    state.live='err'; state._wasErr = true; render();
  }
  timer = setTimeout(tick, document.hidden ? 15000 : POLL_MS);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && token){ clearTimeout(timer); tick(); } });
async function start(){
  render();
  try { await loadChats(true); await loadSent(); state.live='on'; } catch(e){ if (e.message==='auth'){ toast('토큰이 맞지 않아요'); ls.del('cci_token'); token=''; } else state.live='err'; }
  render(); loadAvatars().then(render);
  clearTimeout(timer); timer = setTimeout(tick, POLL_MS);
}


// ---------- Claude 운영용 도우미 (javascript로 호출) ----------
function applyUpsert(list, card){
  const i = list.findIndex(x => x.id === card.id || (!card.id && x.name === card.name) || (card.id && x.name === card.name && x.status!=='deleted'));
  const now = new Date().toISOString();
  if (i < 0){ list.push({ status:'draft', ...card, id: card.id || ('c'+rid()), createdAt: now, updatedAt: now, sortKey: card.sortKey || now }); return 'added'; }
  const old = list[i];
  if (old.status === 'approved' && old.approval && !(state.sent[old.approval.id] && state.sent[old.approval.id].state==='sent')) return 'locked';
  const keepId = old.id;
  list[i] = { ...old, ...card, id: keepId, updatedAt: now, sortKey: card.sortKey || now };
  if (!('status' in card)) list[i].status = (card.draftMessages && card.draftMessages.length) || card.needsReply ? 'draft' : (old.status==='deleted'?'draft':old.status);
  if (list[i].status !== 'approved') list[i].approval = null;
  return 'updated';
}
async function commitAll(fn, msg){
  for (let k=0;k<6;k++){
    await loadChats(true); await loadSent();
    const res = fn(state.chats);
    const body = JSON.stringify({ updatedAt: new Date().toISOString(), chats: state.chats }, null, 1);
    const r = await api('chats.json', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: msg, content: b64enc(body), sha: state.sha }) });
    if (r.ok){ state.etag=null; render(); return res; }
    if (r.status!==409 && r.status!==422) throw new Error('put '+r.status);
    await new Promise(z=>setTimeout(z, 400*(k+1)));
  }
  throw new Error('conflict');
}
window.CCI = {
  ready: () => !!token,
  list: async () => { await loadChats(true); await loadSent(); return state.chats.map(c => ({ id:c.id, name:c.name, status:c.status, category:c.category, sent: c.approval ? (state.sent[c.approval.id]||{}).state||'queued' : null, last: (c.messages||[]).slice(-1)[0] || null, draft: c.draftMessages||[] })); },
  get: async (idOrName) => { await loadChats(true); return state.chats.find(c => c.id===idOrName || c.name===idOrName) || null; },
  upsertMany: async (cards) => commitAll(list => cards.map(c => applyUpsert(list, c)), `Claude: 초안 ${cards.length}개`),
  skip: async (idOrName, memo) => commitAll(list => { const c = list.find(x=>x.id===idOrName||x.name===idOrName); if(!c) return 'none'; if (c.status==='approved') return 'locked'; c.status='skipped'; c.skipMemo=memo||''; c.updatedAt=new Date().toISOString(); return 'ok'; }, `Claude: 정리 ${idOrName}`),
  setAvatars: async (map) => { const g = await api('avatars.json'); let cur={}, sha; if (g.ok){ const j=await g.json(); sha=j.sha; cur=JSON.parse(b64dec(j.content)||'{}'); } const merged={...cur,...map}; const r = await api('avatars.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'프사 갱신',content:b64enc(JSON.stringify(merged)),sha})}); state.avatars=merged; render(); return r.status; },
  approvedQueue: async () => { await loadChats(true); await loadSent(); return state.chats.filter(c => c.status==='approved' && c.approval && !(state.sent[c.approval.id])).map(c => ({ id:c.id, name:c.name, approvalId:c.approval.id, messages:c.approval.messages })); },
  markSent: async (approvalId, name, result, reason) => { const g = await api('sent.json'); let cur={}, sha; if (g.ok){ const j=await g.json(); sha=j.sha; cur=JSON.parse(b64dec(j.content)||'{}'); } cur[approvalId] = { state: result, name, at: new Date().toISOString(), reason: reason||'', device:'Claude' }; const r = await api('sent.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Claude 발송 기록: '+name,content:b64enc(JSON.stringify(cur)),sha})}); state.sentEtag=null; await loadSent(); render(); return r.status; }
};

// ---------- one-time import from old inbox (opener tab) ----------
const OLD_ORIGIN = 'https://chaechae-private-inbox.dreamch7777.chatgpt.site';
window.addEventListener('message', async (ev) => {
  if (ev.origin !== OLD_ORIGIN || !ev.data || ev.data.type !== 'cci-import' || !token) return;
  try {
    await loadChats(true).catch(()=>{});
    const have = new Set(state.chats.map(c => c.id));
    const add = (ev.data.chats||[]).filter(c => !have.has(c.id));
    state.chats = state.chats.concat(add);
    const body = JSON.stringify({ updatedAt: new Date().toISOString(), chats: state.chats }, null, 1);
    const put = async (path, text, msg) => {
      const g = await api(path); const sha = g.ok ? (await g.json()).sha : undefined;
      const r = await api(path, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: msg, content: b64enc(text), sha }) });
      if (!r.ok) throw new Error(path+' '+r.status);
    };
    await put('chats.json', body, '기존 답장함 가져오기');
    if (ev.data.avatars){ const merged = { ...state.avatars, ...ev.data.avatars }; await put('avatars.json', JSON.stringify(merged), '프사 가져오기'); state.avatars = merged; }
    state.etag = null; await loadChats(true); render();
    ev.source && ev.source.postMessage({ type:'cci-import-done', added: add.length }, ev.origin);
    toast(`기존 답장함 ${add.length}개 가져왔어요`);
  } catch(e){ ev.source && ev.source.postMessage({ type:'cci-import-fail', error: String(e) }, ev.origin); }
});
if (window.opener) { try { window.opener.postMessage({ type:'cci-ready' }, OLD_ORIGIN); } catch(e){} }
start();
})();
