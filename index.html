<title>채채 답장함</title>

<style>
:root{
  --bg:#fff4f7;--card:#ffffff;--line:#f6dde5;--text:#4a3640;--sub:#a68c96;
  --them:#f7f1ff;--me:#ffe0ea;--meSoft:#fff0f4;--accent:#e98aa6;--ok:#4fae7f;--warn:#e39a5b;--bad:#e06a7e;
  --chip:#ffffff;--chipOn:#ffc8d6;--chipOnText:#5b2f40;--shadow:0 6px 20px rgba(233,138,166,.12);
  --pri:#ffd1dd;--priText:#5b2f40;--draft:#ffd9e4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#221a1e;--card:#2c2228;--line:#43333b;--text:#f6e8ee;--sub:#c3a6b2;
    --them:#352b3d;--me:#5a3444;--meSoft:#3f2c35;--accent:#ffb3c7;--chip:#2c2228;--chipOn:#ffb3c7;--chipOnText:#3a1f2a;--shadow:none;--pri:#ffb3c7;--priText:#3a1f2a;--draft:#6a3a4c;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);background-image:linear-gradient(180deg,#fff4f7 0%,#fbf3ff 55%,#f3f7ff 100%);background-attachment:fixed;color:var(--text);font-family:"NanumSquareRound","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
h1{font-family:'Gaegu',"NanumSquareRound",sans-serif;font-size:32px;font-weight:700;color:#e2789a;margin:0;color:letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:6px;grid-column:2}
h1 .hface{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 3px rgba(226,120,154,.25))}
h1 .sp{display:inline-flex;width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,#ffd1dd,#e9d9ff);align-items:center;justify-content:center;font-size:15px}
.live{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;grid-column:3;justify-self:end}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.on{background:var(--ok)} .dot.err{background:var(--bad)}
.tabs{display:flex;gap:5px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:var(--chip);color:var(--text);padding:8px 10px;border-radius:999px;font-size:13px;white-space:nowrap;cursor:pointer;font-weight:700;transition:transform .1s;border:1px solid var(--line)}
.tab:active{transform:scale(.96)}
.tab.on{background:var(--chipOn);color:var(--chipOnText);border-color:var(--chipOn)}
.tab b{margin-left:4px;font-weight:600;opacity:.8}
main{max-width:640px;margin:0 auto;padding:12px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.head{display:flex;gap:12px;align-items:center}
.av{width:50px;height:50px;border-radius:38%;background:var(--chip);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--sub)}
.name{font-weight:800;font-size:18px;letter-spacing:-.3px}
.time{font-size:13px;color:var(--sub);margin-top:2px}
.reason{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--meSoft);font-weight:700;font-size:14px}
.summary{margin:12px 0 4px;color:var(--sub);font-size:15px;line-height:1.5}
.msgs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.b{max-width:80%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.b a.lnk{color:#2563eb;text-decoration:underline;word-break:break-all}
.b small{display:block;font-size:11px;color:var(--sub);margin-top:4px}
.them{align-self:flex-start;background:var(--them);border-top-left-radius:6px}
.me{align-self:flex-end;background:var(--meSoft);border-top-right-radius:6px}
.lbl{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.draft{align-self:flex-end;background:var(--draft);color:var(--chipOnText);border-top-right-radius:6px}
.edit textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:15px;background:var(--bg);color:var(--text);margin-bottom:6px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:13px 0;font-size:16px;cursor:pointer;font-weight:700}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--priText)}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:var(--warn);margin-top:8px}
.st{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--chip)}
.st.sent{color:var(--ok)} .st.fail{color:var(--bad)} .st.wait{color:var(--warn)}
details{margin-top:10px} summary{cursor:pointer;color:var(--sub);font-size:14px}
.empty{text-align:center;color:var(--sub);padding:60px 0}
.setup{max-width:480px;margin:40px auto;padding:0 16px}
.setup input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:15px;background:var(--card);color:var(--text)}
.setup .btn{width:100%;margin-top:10px}
.dedit{outline:none;min-width:3em;cursor:text;-webkit-user-select:text;user-select:text}
.dedit:focus{box-shadow:0 0 0 2px var(--accent) inset}
.dedit:empty:before{content:'여기에 입력';color:#8a8174}
.saveinfo{font-size:12px;color:var(--sub);text-align:right;margin-top:4px}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lchip{display:inline-block;background:#fff;border:1px solid var(--line);color:#2563eb;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700;text-decoration:none}
.b.media{background:transparent!important;box-shadow:none!important;border:0!important;padding:2px 0!important}
.b.media.ph{padding:2px 0!important}
.mimg{display:block;max-width:100%;border-radius:14px;background:#f6e9ef;cursor:pointer;-webkit-tap-highlight-color:transparent}
.av,.mav{cursor:pointer}
.b.me .mimg{margin-left:auto}
.mimg.tp{background:transparent;border-radius:0}
.lbox{position:fixed;inset:0;z-index:99;background:rgba(20,10,16,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;touch-action:pinch-zoom}
.lscroll{width:100%;max-width:640px;max-height:80vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;align-items:center;-webkit-overflow-scrolling:touch}
.lbox img{width:100%;height:auto;object-fit:contain;border-radius:8px;-webkit-touch-callout:default;user-select:auto}
.lbar{display:flex;gap:10px;margin-top:16px}
.never{display:block;margin:10px auto 0;border:0;background:none;color:#b0909e;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.skiplist{background:#fff;border:1px solid #f3dde6;border-radius:14px;padding:8px 12px;margin:6px 0 10px}.skrow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #f3dde6}.skrow:last-child{border:0}
.gbox{position:fixed;inset:0;z-index:98;background:rgba(40,20,32,.45);display:flex;align-items:flex-end;justify-content:center}
.gsheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.ghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.ghead b{font-size:17px}
.ghead .lx{position:static;background:#f5e8ef;color:#7a5566}
.grow2{display:flex;gap:8px}.grow2 .gq{flex:2}.grow2 .gmax{flex:1;min-width:0}
.gbtn{width:100%;border:0;border-radius:14px;background:#ffc9d8;color:#5a3444;font:inherit;font-weight:800;font-size:16px;padding:12px;margin:10px 0;cursor:pointer}
.gbtn2{border:1px solid #f2cbd8;background:#fff6f9;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;text-align:left}
.gopts{display:flex;flex-direction:column;gap:8px}
.gsheet,.gsheet *{box-sizing:border-box}.gsheet [hidden]{display:none!important}.gsheet{overflow-x:hidden}.gsheet .search{min-width:0}
.gmain{background:#ff8fb1;color:#fff;padding:15px;font-size:17px;margin:4px 0 6px;box-shadow:0 4px 14px rgba(255,143,177,.35)}
.gtip{text-align:center;font-size:13px;color:#9a8290;margin-bottom:12px}.gtip b{color:#6d5262}
.gor{display:flex;align-items:center;gap:10px;color:#c3aab6;font-size:12px;margin:14px 0 10px}.gor:before,.gor:after{content:'';flex:1;height:1px;background:#f0e2e8}
.gchips{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gchip{border:0;background:#fbf5f8;color:#6d5262;border-radius:12px;padding:11px 0;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.gchip.on{background:#f6e3ec}
.gmorebtn{display:block;margin:14px auto 0;border:0;background:none;color:#b0909e;font:inherit;font-size:13px;cursor:pointer}.gchips{margin-top:8px}.gpanel{margin-top:8px}.gpanel .grow2{margin-bottom:6px}
.gstat{margin-top:10px}.gstat:has(.gitem,.gconf,.gopts){margin-top:12px}
.gtabs{display:flex;gap:6px;margin-bottom:10px}.gtab{flex:1;border:1px solid #f2cbd8;background:#fff;border-radius:999px;padding:9px;font:inherit;font-weight:700;color:#8a6b7a;cursor:pointer}.gtab.on{background:#ffc9d8;color:#5a3444;border-color:#ffc9d8}
.gbtn3{flex:1;border:1px solid #f2cbd8;background:#fff6f9;border-radius:12px;padding:10px 8px;font:inherit;font-size:14px;font-weight:700;color:#5a3444;cursor:pointer;white-space:nowrap}
.ghint{color:#8a7f88;font-size:13px;line-height:1.5;padding:6px 2px}.gerr{color:#d2496f}
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gitem{border:1px solid #f3dde6;background:#fff;border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;font:inherit}
.gitem img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#faf3f6}
.gb{font-size:11px;color:#a28a96}.gn{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.gp{font-weight:800;font-size:14px;color:#d2496f}
.gconf{display:flex;gap:12px;align-items:center}.gconf img{width:96px;height:96px;object-fit:cover;border-radius:12px}
.gqty{display:block;margin-top:10px;font-size:14px}.gqty select{margin-left:8px;font:inherit;padding:4px 8px;border-radius:8px}

.bdel{align-self:flex-end;border:0;border-radius:999px;background:#ff6b8b;color:#fff;font:inherit;font-size:14px;font-weight:700;padding:8px 14px;margin:-2px 0 6px;cursor:pointer}
.favb{border:0;background:none;font-size:20px;line-height:1;color:#e8b4c4;cursor:pointer;padding:0 2px;vertical-align:-2px}.favb.on{color:#f5b301}
.lx{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:100;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;font-weight:700;line-height:44px;padding:0;cursor:pointer;backdrop-filter:blur(6px)}
.lbar button{border:0;border-radius:999px;padding:12px 22px;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.lsave{background:#ffd1df;color:#5a2a3c}.lclose{background:rgba(255,255,255,.18);color:#fff}
.lhint{color:rgba(255,255,255,.6);font-size:12px;margin-top:10px}
.b.media small{display:block;margin-top:3px}
.grow{display:flex;gap:8px;align-items:flex-start;align-self:flex-start;max-width:88%}
.grow .b{max-width:100%}
.gcol{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:100%}
.gname{font-size:12px;color:#8a7f88;margin:0 0 3px 4px;font-weight:600}
.mav{width:36px;height:36px;border-radius:14px;object-fit:cover;flex:none;background:#f3e6ee}
.mav.sp{visibility:hidden}
.who{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:3px}
.gbadge{font-size:11px;font-weight:800;background:#e9d9ff;color:#5b3a8a;border-radius:999px;padding:2px 8px;vertical-align:middle}
.shotrow{margin-top:10px}
.shot{margin-top:8px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#b2c7d9}
.shot img{display:block;width:100%;height:auto}
.tonerow{display:flex;gap:3px;margin-top:12px;background:#f6eef2;border-radius:999px;padding:3px}
.tone{flex:1;border:0;background:transparent;color:#9a8290;border-radius:999px;padding:7px 0;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.tone.on{background:#fff;color:#5a3444;box-shadow:0 1px 4px rgba(120,60,90,.15)}
.minirow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.mini{border:0;background:#fbf5f8;color:#6d5262;border-radius:12px;padding:8px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.mini:active,.mini.on{background:#f6e3ec}
.emo{margin-top:8px;border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:10px}
.ecats{display:flex;flex-wrap:nowrap;gap:6px;margin:0 -10px 10px;padding:2px 10px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.ecats .ecat{flex:none;scroll-snap-align:start}
.ehint{font-size:12px;color:var(--sub);margin:0 2px 8px}
.ecat{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit}
.ecat.on{background:var(--chipOn);color:var(--chipOnText);border-color:var(--chipOn)}
.ecat.star{font-size:15px;color:#f5b400}
.ecat.star.on{color:#fff}
.egrid{display:flex;flex-wrap:wrap;gap:7px;max-height:420px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ei{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:11px 13px;font-size:17px;cursor:pointer;white-space:nowrap;font-family:inherit;min-width:52px}
.ei:active{background:var(--meSoft)}
.notif{border:0;background:var(--chip);color:var(--text);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}
.subbar{display:flex;justify-content:flex-end;gap:8px;align-items:center;min-height:8px;margin:4px 0}
.pickbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin:8px 0 4px}
.search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:12px 14px;font-size:16px;outline:none;-webkit-appearance:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:10px;max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pick{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid transparent;background:none;color:var(--text);border-radius:14px;padding:11px 10px;text-align:left;cursor:pointer;min-width:0}
.pick.on{background:var(--meSoft);border-color:var(--chipOn)}
.pn{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ps{font-size:12px;color:var(--sub);flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.bar{display:flex;justify-content:flex-end;margin-top:6px}
.link{background:none;border:0;color:var(--sub);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}


.cal{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.cday{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 14px 6px;box-shadow:var(--shadow)}
.cdh{font-family:'Gaegu',"NanumSquareRound",sans-serif;font-weight:700;font-size:21px;color:#e2789a;margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.crel{font-family:inherit;font-size:13px;font-weight:700;background:#ffe3ec;color:#c05a7c;border-radius:999px;padding:3px 10px}
.crel.past{background:#eee;color:#888}
.cev{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-top:1px dashed var(--line)}
.cday .cev:first-of-type{border-top:0}
.ctm{flex:none;min-width:74px;font-weight:800;font-size:15px;color:var(--text)}
.cbody{flex:1;min-width:0}
.ctt{font-weight:800;font-size:15.5px;line-height:1.4}
.cmeta{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.4}
.cdel{flex:none;border:1px solid var(--line);background:var(--card);color:var(--bad);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.cdel.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
.gsheet {
  --kgb-accent: #f28bb0;
  --kgb-accent-strong: #d9658f;
  --kgb-soft: #fde9f1;
  --kgb-line: #f3dde6;
  --kgb-card: var(--gift-card, #ffffff);
  --kgb-muted: #6a7b8b;
  --kgb-pink: #ef5b87;
  
}
.gsheet button { font: inherit; cursor: pointer; }
.gsheet button:disabled { opacity: .55; cursor: default; }
.kgb-find { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.kgb-go { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 13px 14px; background: var(--kgb-accent); color: #fff; font-size: 16px; box-shadow: 0 2px 8px rgba(217,101,143,.25); }
.kgb-go span { font-size: 20px; }
.kgb-sub { border: 1.5px solid var(--kgb-line); background: var(--kgb-card); color: var(--kgb-accent-strong); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.kgb-sub.hot { border-color: var(--kgb-accent); background: var(--kgb-soft); animation: kgb-pulse 1.4s ease-in-out 3; }
@keyframes kgb-pulse { 50% { box-shadow: 0 0 0 4px rgba(242,139,176,.3); } }
.kgb-help { margin: 0; font-size: 12px; color: var(--kgb-muted); line-height: 1.5; }
.kgb-link { border: 0; background: none; padding: 0; color: var(--kgb-accent-strong); font-weight: 700; font-size: 12px; text-decoration: none; white-space: nowrap; }
.kgb-note { margin: 0; font-size: 12px; color: #9a5b00; background: #fff6e5; border-radius: 8px; padding: 6px 8px; }
.kgb-watch { margin: 0; font-size: 12px; color: var(--kgb-accent-strong); }
.kgb-msg { margin: 0; font-size: 12px; color: var(--kgb-accent-strong); }
.kgb-paste { display: flex; gap: 6px; }
.kgb-paste input { flex: 1; min-width: 0; border: 1.5px solid var(--kgb-line); border-radius: 10px; padding: 8px 10px; font-size: 16px; }
.kgb-paste button { border: 0; border-radius: 10px; padding: 0 14px; background: var(--kgb-accent); color: #fff; font-weight: 700; }

.kgb-found { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px; border-radius: 14px; border: 1.5px solid var(--kgb-accent); background: var(--kgb-soft); }
.kgb-found.off { border-color: #e2b4b4; background: #fdf1f1; }
.kgb-thumb { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: var(--kgb-card); display: grid; place-items: center; font-size: 24px; flex: none; }
.kgb-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.kgb-thumb.sm { width: 40px; height: 40px; border-radius: 8px; font-size: 18px; }

async function loadChats(force){

  if (r.status === 401 || r.status === 403) throw new Error('auth');
  if (r.status === 404) throw new Error('nofile');

  return true;
}

function applyUpsert(list, card){
  const i = list.findIndex(x => x.id === card.id || (!card.id && x.name === card.name) || (card.id && x.name === card.name && x.status!=='deleted'));
  const now = new Date().toISOString();
  if (i < 0){ list.push({ status:'draft', ...card, id: card.id || ('c'+rid()), createdAt: now, updatedAt: now, sortKey: card.sortKey || now }); return 'added'; }
  const old = list[i];
  if (old.status === 'approved' && old.approval && !(state.sent[old.approval.id] && state.sent[old.approval.id].state==='sent')) return 'locked';
  const keepId = old.id;
  list[i] = { ...old, ...card, id: keepId, updatedAt: now, sortKey: card.sortKey || now };
  if (!('status' in card)) list[i].status = (card.draftMessages && card.draftMessages.length) || card.needsReply ? 'draft' : (old.status==='deleted'?'draft':old.status);
  if (list[i].status !== 'approved') list[i].approval = null;
  return 'updated';
}
async function commitAll(fn, msg){

    const res = fn(state.chats);
    const body = JSON.stringify({ updatedAt: new Date().toISOString(), chats: state.chats }, null, 1);
    const r = await api('chats.json', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: msg, content: b64enc(body), sha: state.sha }) });
    if (r.ok){ state.etag=null; render(); return res; }
    if (r.status!==409 && r.status!==422) throw new Error('put '+r.status);

  }
  throw new Error('conflict');
}

  ready: () => !!token,
  list: async () => { await loadChats(true); await loadSent(); return state.chats.map(c => ({ id:c.id, name:c.name, status:c.status, category:c.category, sent: c.approval ? (state.sent[c.approval.id]||{}).state||'queued' : null, last: (c.messages||[]).slice(-1)[0] || null, draft: c.draftMessages||[] })); },
  get: async (idOrName) => { await loadChats(true); return state.chats.find(c => c.id===idOrName || c.name===idOrName) || null; },
  upsertMany: async (cards) => commitAll(list => cards.map(c => applyUpsert(list, c)), `Claude: 초안 ${cards.length}개`),
  skip: async (idOrName, memo) => commitAll(list => { const c = list.find(x=>x.id===idOrName||x.name===idOrName); if(!c) return 'none'; if (c.status==='approved') return 'locked'; c.status='skipped'; c.skipMemo=memo||''; c.updatedAt=new Date().toISOString(); return 'ok'; }, `Claude: 정리 ${idOrName}`),
  setAvatars: async (map) => { const g = await api('avatars.json'); let cur={}, sha; if (g.ok){ const j=await g.json(); sha=j.sha; cur=JSON.parse(b64dec(j.content)||'{}'); } const merged={...cur,...map}; const r = await api('avatars.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'프사 갱신',content:b64enc(JSON.stringify(merged)),sha})}); state.avatars=merged; render(); return r.status; },

  requestExport: async (names, lines) => { const id = 'r'+Date.now().toString(36); const g = await api('requests/export.json'); const sha = g.ok ? (await g.json()).sha : undefined; const r = await api('requests/export.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'대화 내보내기 요청 '+names.length+'개',content:b64enc(JSON.stringify({id,names,lines:lines||40,at:new Date().toISOString()})),sha})}); return r.ok ? id : ('fail '+r.status); },
  getExport: async (id) => { const r = await api('exports/'+id+'.json',{headers:{'Accept':'application/vnd.github.raw+json'}}); return r.ok ? JSON.parse(await r.text()) : null; },
  heartbeat: async () => { const r = await api('heartbeat.json',{headers:{'Accept':'application/vnd.github.raw+json'}}); return r.ok ? JSON.parse(await r.text()) : null; },
  approvedQueue: async () => { await loadChats(true); await loadSent(); return state.chats.filter(c => c.status==='approved' && c.approval && !(state.sent[c.approval.id])).map(c => ({ id:c.id, name:c.name, approvalId:c.approval.id, messages:c.approval.messages })); },
  markSent: async (approvalId, name, result, reason) => { const g = await api('sent.json'); let cur={}, sha; if (g.ok){ const j=await g.json(); sha=j.sha; cur=JSON.parse(b64dec(j.content)||'{}'); } cur[approvalId] = { state: result, name, at: new Date().toISOString(), reason: reason||'', device:'Claude' }; const r = await api('sent.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Claude 발송 기록: '+name,content:b64enc(JSON.stringify(cur)),sha})}); state.sentEtag=null; await loadSent(); render(); return r.status; }
};

// ---------- one-time import from old inbox (opener tab) ----------
const OLD_ORIGIN = 'https://chaechae-private-inbox.dreamch7777.chatgpt.site';
window.addEventListener('message', async (ev) => {
  if (ev.origin !== OLD_ORIGIN || !ev.data || ev.data.type !== 'cci-import' || !token) return;
  try {
    await loadChats(true).catch(()=>{});
    const have = new Set(state.chats.map(c => c.id));
    const add = (ev.data.chats||[]).filter(c => !have.has(c.id));
    state.chats = state.chats.concat(add);
    const body = JSON.stringify({ updatedAt: new Date().toISOString(), chats: state.chats }, null, 1);
    const put = async (path, text, msg) => {
      const g = await api(path); const sha = g.ok ? (await g.json()).sha : undefined;
      const r = await api(path, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: msg, content: b64enc(text), sha }) });
      if (!r.ok) throw new Error(path+' '+r.status);
    };
    await put('chats.json', body, '기존 답장함 가져오기');
    if (ev.data.avatars){ const merged = { ...state.avatars, ...ev.data.avatars }; await put('avatars.json', JSON.stringify(merged), '프사 가져오기'); state.avatars = merged; }
    state.etag = null; await loadChats(true); render();
    ev.source && ev.source.postMessage({ type:'cci-import-done', added: add.length }, ev.origin);
    toast(`기존 답장함 ${add.length}개 가져왔어요`);
  } catch(e){ ev.source && ev.source.postMessage({ type:'cci-import-fail', error: String(e) }, ev.origin); }
});
if (window.opener) { try { window.opener.postMessage({ type:'cci-ready' }, OLD_ORIGIN); } catch(e){} }
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(()=>{}); }
start();
})();
</script>
